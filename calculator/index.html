<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="../Assets/favicon.ico" />
    <title>Points Calculator</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav>
      <div class="nav-left">
        <img src="../Assets/logo.png" alt="Logo" />

        <h1>
          <a href="/"> King of Colors </a>
        </h1>
      </div>

      <div class="nav-links">
        <a href="../leaderboard/"> Leaderboard </a>
        <a href="../calculator/"> Calculator </a>
        <a href="../logs/"> Logs </a>
      </div>
    </nav>

    <div class="container">
      <h1>Risk King of Colors</h1>
      <h2>Points Calculator</h2>

      <div class="form">
        <label>Number of Games Played</label>
        <input type="number" id="gamesPlayed" min="0" />

        <label>Number of Games Won</label>
        <input type="number" id="gamesWon" min="0" />

        <label>Game Mode</label>
        <select id="gameMode">
          <option value="1v1">1v1</option>
          <option value="2v2">2v2</option>
          <option value="3v3">3v3</option>
          <option value="3pFFA">3 Player FFA</option>
          <option value="4pFFA">4 Player FFA</option>
          <option value="5pFFA">5 Player FFA</option>
          <option value="6pFFA">6 Player FFA</option>
        </select>

        <label>Game Rank</label>
        <select id="gameRank">
          <option value="Knight">Knight</option>
          <option value="Baronet">Baronet</option>
          <option value="Baron">Baron</option>
          <option value="Viscount">Viscount</option>
          <option value="Count">Count</option>
          <option value="Marquess">Marquess</option>
          <option value="Duke">Duke</option>
        </select>

        <button onclick="calculatePoints()">Calculate Points</button>
      </div>

      <div class="result">Final Points: <span id="result">0</span></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
